name: Backend CI

on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - '.editorconfig'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.editorconfig'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'backend/Directory.Build.props'

      - name: Restore dependencies
        run: dotnet restore backend/ElectronicLive.sln

      - name: Build solution
        run: dotnet build backend/ElectronicLive.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test backend/ElectronicLive.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/tests/**/TestResults/test_results.trx
