<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>New shows announced: {{ArtistName}}</title>
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f8fafc;
    }
    @media screen and (max-width: 600px) {
      .email-container {
        width: 100% !important;
        padding: 12px !important;
      }
      .card-content {
        padding: 16px !important;
      }
      .ticket-button {
        display: block !important;
        width: 100% !important;
        margin-bottom: 8px !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc;">
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0f172a;">
    <tr>
      <td align="center" style="padding: 24px 12px;">
        <!-- Email Container -->
        <table border="0" cellpadding="0" cellspacing="0" width="100%" class="email-container" style="max-width: 600px; width: 100%;">
          
          <!-- Header -->
          <tr>
            <td align="center" style="padding-bottom: 24px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center">
                    <h1 style="margin: 0 0 6px 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: #f8fafc;">
                      ⚡ ElectronicLive
                    </h1>
                    <div style="font-size: 13px; font-weight: 500; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">
                      EDM &amp; Live Gig Tracker
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Digest Sub-header -->
          <tr>
            <td style="background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; text-align: left;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td>
                    <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin-bottom: 4px;">
                      Artist Alert
                    </div>
                    <div style="font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 4px;">
                      {{ArtistName}}
                    </div>
                    <div style="font-size: 14px; color: #94a3b8;">
                      New shows announced &bull; {{DigestDate}}
                    </div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Spacer -->
          <tr>
            <td height="16" style="font-size: 0px; line-height: 0px;">&nbsp;</td>
          </tr>

          <!-- Event Cards -->
          {{EventCards}}

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top: 32px; padding-bottom: 24px; text-align: center;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="font-size: 12px; color: #64748b; line-height: 1.6;">
                    You are receiving this digest because you tracked alerts for <strong>{{ArtistName}}</strong> on ElectronicLive.<br>
                    <a href="{{UnsubscribeUrl}}" style="color: #94a3b8; text-decoration: underline; margin-top: 8px; display: inline-block;">
                      Unsubscribe from alerts for {{ArtistName}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
